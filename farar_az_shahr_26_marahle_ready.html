const c=document.getElementById("game"),ctx=c.getContext("2d");
let audioCtx=null;
let musicTimer=null, musicStep=0;
function beep(freq,duration=0.08,type="sine",gain=.035){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=gain;
    o.connect(g);g.connect(audioCtx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}
function stageSound(){beep(520,.08);setTimeout(()=>beep(760,.12),90)}
function startMusic(){
  if(!soundOn || musicTimer)return;
  const notes=[196,220,247,294,247,220,165,196];
  musicTimer=setInterval(()=>{
    if(!soundOn)return;
    const n=notes[musicStep++%notes.length];
    beep(n,.20,"triangle",.028);
  },240);
}
function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
}
const W=c.width,H=c.height;
const img=new Image(); img.src=avatarSrc;
let level=1,lives=3,score=0,stars=[],coins=[],enemies=[],walls=[],player={x:55,y:365,r:24},keys={},won=false,dead=false,soundOn=true;
const $=id=>document.getElementById(id);
function rand(a,b){return Math.random()*(b-a)+a}
function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}
function setup(n=level){
  won=false; dead=false; lives=3; stars=[]; coins=[]; enemies=[]; walls=[];
  player={x:55,y:H-48,r:24};
  for(let i=0;i<3;i++) stars.push({x:150+i*220+((n*13)%35),y:75+(i%2)*105,r:17});
  for(let i=0;i<Math.min(8,2+Math.floor(n/3));i++) coins.push({x:100+((i*83+n*17)%520),y:150+((i*57+n*11)%210),r:13});
  let wc=Math.min(10,2+Math.floor(n/2));
  for(let i=0;i<wc;i++) walls.push({x:120+((i*71+n*23)%500),y:100+((i*43+n*29)%245),w:40+(n%3)*8,h:18+(i%2)*12});
  let ec=Math.min(20,1+Math.floor(n/2));
  for(let i=0;i<ec;i++) enemies.push({x:170+((i*91+n*19)%430),y:120+((i*67+n*31)%220),r:18,vx:(i%2?1:-1)*(1.1+n*.09),vy:(i%3===0?1:-1)*(0.7+n*.05)});
  updateUI();
}
function circleRect(px,py,r,rect){
  const nx=Math.max(rect.x,Math.min(px,rect.x+rect.w)),ny=Math.max(rect.y,Math.min(py,rect.y+rect.h));
  return Math.hypot(px-nx,py-ny)<r;
}
function blocked(nx,ny){
  if(nx<25||nx>W-25||ny<25||ny>H-25)return true;
  return walls.some(w=>circleRect(nx,ny,player.r,w));
}
function updateUI(){
  $("level").textContent="مرحله "+level+"/26";
  $("lives").textContent="❤️ "+lives;
  $("stars").textContent="⭐ "+(3-stars.length)+"/3";
  $("score").textContent="🏆 "+score;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#0b1230";ctx.fillRect(0,0,W,H);
  // city
  for(let i=0;i<18;i++){let x=i*42+(i%3)*8,h=45+(i*29%120);ctx.fillStyle=i%2?"#17234d":"#121c3e";ctx.fillRect(x,H-55-h,34,h);
    ctx.fillStyle="#ffd45c";for(let j=0;j<3;j++)ctx.fillRect(x+7+j*9,H-48-h+j*22,5,7)}
  ctx.fillStyle="#183b32";ctx.fillRect(0,H-55,W,55);
  walls.forEach(w=>{ctx.fillStyle="#7b3f2b";ctx.fillRect(w.x,w.y,w.w,w.h);ctx.fillStyle="#a95d40";ctx.fillRect(w.x,w.y,w.w,5)});
  ctx.font="28px sans-serif"; stars.forEach(s=>ctx.fillText("⭐",s.x-14,s.y+10));
  coins.forEach(q=>ctx.fillText("🪙",q.x-13,q.y+9));
  enemies.forEach(e=>ctx.fillText("👾",e.x-14,e.y+10));
  ctx.font="34px sans-serif";ctx.fillText("🚪",W-60,H-43);
  if(img.complete)ctx.drawImage(img,player.x-player.r,player.y-player.r,player.r*2,player.r*2);
  else {ctx.fillStyle="#4ade80";ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill()}
  if(won||dead){
    ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,W,H);
    ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="bold 36px Tahoma";
    ctx.fillText(won?(level===26?"🏆 هر ۲۶ مرحله را بردی!":"🎉 مرحله "+level+" تمام شد!"):"💥 باختی!",W/2,175);
    ctx.font="20px Tahoma";
    ctx.fillText(won?(level<26?"در حال رفتن به مرحله بعد...":"امتیاز نهایی: "+score):"دکمه «شروع مرحله» را بزن و دوباره امتحان کن",W/2,220);
    ctx.textAlign="start";
  }
}
function nextStage(){
  if(won&&level<26){level++;setup(level)}else if(won&&level===26){level=1;score=0;setup(1)}else if(dead){setup(level)}else{setup(level)}
}
function loop(){
  if(!won&&!dead){
    let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
    if(dx||dy){let m=Math.hypot(dx,dy),speed=2.7+level*.035;let nx=player.x+dx/m*speed,ny=player.y+dy/m*speed;if(!blocked(nx,player.y))player.x=nx;if(!blocked(player.x,ny))player.y=ny}
    stars=stars.filter(s=>{if(hit(player,s)){score+=100;return false}return true});
    coins=coins.filter(q=>{if(hit(player,q)){score+=25;return false}return true});
    enemies.forEach(e=>{e.x+=e.vx;e.y+=e.vy;if(e.x<30||e.x>W-30)e.vx*=-1;if(e.y<35||e.y>H-80)e.vy*=-1;
      if(hit(player,e)){lives--;player.x=55;player.y=H-48;if(lives<=0)dead=true}
    });
    if(stars.length===0&&player.x>W-90&&player.y>H-100){won=true;score+=250+level*20}
    updateUI();draw();
  }
  requestAnimationFrame(loop);
}
document.querySelectorAll("[data-key]").forEach(b=>{
  const k=b.dataset.key;
  const down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};
  b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true;try{b.setPointerCapture(e.pointerId)}catch(_){}});b.addEventListener("pointerup",up);b.addEventListener("pointercancel",up);b.addEventListener("pointerleave",up);b.addEventListener("lostpointercapture",up);
});
function enableAudio(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.resume();
    startMusic();
  }catch(e){}
}
document.addEventListener("pointerdown",enableAudio,{once:true});
document.addEventListener("keydown",enableAudio,{once:true});
document.addEventListener("pointerup",()=>{keys.up=keys.down=keys.left=keys.right=false});
document.addEventListener("pointercancel",()=>{keys.up=keys.down=keys.left=keys.right=false});
document.addEventListener("contextmenu",e=>{if(e.target.closest("#game"))e.preventDefault()});
const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",a:"left",s:"down",d:"right"};
addEventListener("keydown",e=>{if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}});
addEventListener("keyup",e=>{if(map[e.key])keys[map[e.key]]=false});
$("restart").onclick=nextStage;
$("sound").onclick=()=>{
  soundOn=!soundOn;
  $("sound").textContent=soundOn?"🔊 صدا: روشن":"🔇 صدا: خاموش";
  if(soundOn){enableAudio()}
  else stopMusic();
};
setup(1);loop();
</script>
